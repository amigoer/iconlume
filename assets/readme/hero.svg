<svg
  width="1200"
  height="480"
  viewBox="0 0 1200 480"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="heroTitle heroDesc"
>
  <title id="heroTitle">Graphite tile with an amber glass seam</title>
  <desc id="heroDesc">
    A rounded graphite square on a near-black field, cut by one diagonal slit
    inlaid with warm amber glass under soft upper-left light.
  </desc>

  <defs>
    <radialGradient
      id="bgGlow"
      cx="600"
      cy="205"
      r="500"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#171D26" stop-opacity="0.9" />
      <stop offset="0.6" stop-color="#171D26" stop-opacity="0.35" />
      <stop offset="1" stop-color="#171D26" stop-opacity="0" />
    </radialGradient>

    <linearGradient
      id="tile"
      x1="456"
      y1="88"
      x2="746"
      y2="400"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#303743" />
      <stop offset="0.55" stop-color="#1B2028" />
      <stop offset="1" stop-color="#10141A" />
    </linearGradient>

    <linearGradient
      id="rim"
      x1="450"
      y1="88"
      x2="696"
      y2="360"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#C6D0DF" stop-opacity="0.46" />
      <stop offset="0.42" stop-color="#778293" stop-opacity="0.14" />
      <stop offset="1" stop-color="#778293" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop stop-color="#000000" stop-opacity="0.68" />
      <stop offset="0.52" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient
      id="amber"
      x1="500"
      y1="340"
      x2="700"
      y2="140"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#F2AE58" />
      <stop offset="0.52" stop-color="#FFE1B0" />
      <stop offset="1" stop-color="#A85A1E" />
    </linearGradient>

    <linearGradient
      id="seamEdge"
      x1="530"
      y1="300"
      x2="680"
      y2="150"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FFE9C7" stop-opacity="0" />
      <stop offset="0.28" stop-color="#FFF0D6" stop-opacity="0.52" />
      <stop offset="0.68" stop-color="#FFE9C7" stop-opacity="0.24" />
      <stop offset="1" stop-color="#FFE9C7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="#0B0D11" />
  <rect width="1200" height="480" fill="url(#bgGlow)" />

  <ellipse cx="600" cy="414" rx="190" ry="22" fill="url(#contact)" />

  <rect x="440" y="80" width="320" height="320" rx="72" fill="url(#tile)" />
  <rect
    x="440.75"
    y="80.75"
    width="318.5"
    height="318.5"
    rx="71.25"
    fill="none"
    stroke="url(#rim)"
    stroke-width="1.5"
  />

  <path
    d="M500 340L700 140"
    stroke="#05070A"
    stroke-width="28"
    stroke-linecap="round"
  />
  <path
    d="M500 340L700 140"
    stroke="url(#amber)"
    stroke-width="20"
    stroke-linecap="round"
  />
  <path
    d="M530 300L680 150"
    stroke="url(#seamEdge)"
    stroke-width="1.3"
    stroke-linecap="round"
  />
</svg>
